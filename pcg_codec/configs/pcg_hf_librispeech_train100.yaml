codec: "pcg"
dataset: "librispeech_train100"
#dataset: "librispeech_dummy"

streaming:
  # LibriSpeech is 16kHz; using 16k avoids resampling.
  sample_rate_hz: 16000
  hop_samples: 320
  lookahead_samples: 0

model:
  latent_dim: 32
  num_blocks: 8
  block_dim: 4

  encoder:
    hidden_dim: 256
  decoder:
    hidden_dim: 256

  transform:
    type: "mixing"  # mixing | identity

  quantizer:
    type: "fsq"  # fsq | block_codebook
    levels: 8
    codebook_size: 256

  dag:
    depth: 2
    parents_k: 2
    seed: 0

  prior:
    hidden_dim: 256
    embed_dim: 128

loss:
  waveform:
    type: "l1"
  mrstft:
    enabled: true
    fft_sizes: [256, 512, 1024]
    hop_sizes: [64, 128, 256]
    win_lengths: [256, 512, 1024]
  transform:
    orth:
      enabled: true
      weight: 0.001
    offdiag_cov:
      enabled: true
      weight: 0.001
  sens_eq:
    enabled: false
    weight: 0.1

training:
  seed: 0
  device: "cuda"
  batch_size: 64
  dataloader:
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  amp:
    enabled: true
    dtype: "bfloat16"  # bfloat16 | float16 | float32
    grad_scaler: true  # only used for float16 on CUDA
  cuda:
    cudnn_benchmark: true
    allow_tf32: true
    matmul_precision: "high"
  timing:
    enabled: false
    sync_cuda: true
  split: "train"
  steps: 5000
  lr: 0.0005
  log_every: 50
  eval_every: 500
  lambda_rd: 0.01

evaluation:
  split: "val"
  # Streaming evaluation is expensive (it runs frame-by-frame encode/decode loops).
  # Use a smaller eval batch size than training to keep periodic eval fast.
  batch_size: 8
  num_batches: 10
  progress: true
  ttfa_chunk_bytes: 256

output:
  results_dir: "pcg_codec/results"
  run_name_prefix: "pcg"
